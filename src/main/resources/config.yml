# Configuración de VoranixExtremo

resourcepack:
  # URL pública y directa al .zip del resource pack (ver carpeta resourcepack/ en el
  # repo para armarlo). Si está vacío, no se le ofrece resource pack a nadie y las
  # monedas se ven como un ítem genérico (sin la textura). Lo tienen que subir a algún
  # lado (ej. un Release de GitHub) para tener una URL directa de descarga.
  url: ""

lives:
  # Vidas con las que empieza cada jugador.
  max: 5
  # Gamemode al que pasa un jugador cuando se queda sin vidas.
  elimination-gamemode: SPECTATOR

pvp:
  # Estado del PVP cuando el plugin se activa por primera vez.
  enabled-by-default: true
  # Sonido que se reproduce a todos los jugadores al activar/desactivar el PVP.
  # Lista de sonidos válidos: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
  sound:
    name: ENTITY_ENDER_DRAGON_GROWL
    volume: 1.0
    pitch: 1.0

economy:
  # Si Vault está instalado en el servidor, VoranixExtremo se registra como su
  # proveedor de economía (así otros plugins de tiendas/subastas usan esta moneda).
  vault-integration: true

  currency:
    singular: "Moneda"
    plural: "Monedas"

  # Cada moneda es un ítem vanilla (material) + un custom-model-data que el resource
  # pack usa para dibujar la textura/modelo real (ver carpeta resourcepack/ en el repo).
  # "value" es el valor de cada moneda en la unidad de la economía (pagar, depositar, retirar).
  # Las 6 denominaciones, texturas, colores (por rareza) y la tasa de conversión (x10 por
  # nivel) vienen del diseño original en el repo voranixmod (CoinDenomination.java).
  # Todas usan IRON_NUGGET como base para que ningún crafteo vanilla las confunda.
  coins:
    estano:
      material: IRON_NUGGET
      custom-model-data: 1001
      display-name: "&fMoneda de Estaño"
      value: 1
    silver:
      material: IRON_NUGGET
      custom-model-data: 1002
      display-name: "&eMoneda de Plata"
      value: 10
    gold:
      material: IRON_NUGGET
      custom-model-data: 1003
      display-name: "&bMoneda de Oro"
      value: 100
    mithril:
      material: IRON_NUGGET
      custom-model-data: 1004
      display-name: "&bMoneda de Mithril"
      value: 1000
    oricalco:
      material: IRON_NUGGET
      custom-model-data: 1005
      display-name: "&dMoneda de Oricalco"
      value: 10000
    ajna:
      material: IRON_NUGGET
      custom-model-data: 1006
      display-name: "&dMoneda de Ajna"
      value: 100000

food:
  # Comidas vendibles por un chef (food.items) y bebidas (food.drinks), con los mismos
  # valores de hambre/saturación/efectos/precio del diseño original en voranixmod
  # (OttokeConfig.java y ModItems.java del módulo "ottoke"). "saturation" es el
  # modificador vanilla (no puntos de saturación directos): saturación real
  # restaurada = hunger * saturation * 2, igual que cualquier comida de Minecraft.
  # "price" está en unidades base (el valor de la moneda Estaño); -1 = no se vende.
  items:
    banderilla_clasica:
      base-material: COOKED_PORKCHOP
      custom-model-data: 2001
      display-name: "&6Banderilla Clásica"
      hunger: 8
      saturation: 0.8
      price: 8
      trade-max-uses: 20
      trade-xp: 2
    banderilla_papa:
      base-material: COOKED_PORKCHOP
      custom-model-data: 2002
      display-name: "&6Banderilla con Papa"
      hunger: 9
      saturation: 0.7
      price: 10
      trade-max-uses: 16
      trade-xp: 5
    banderilla_picante:
      base-material: COOKED_PORKCHOP
      custom-model-data: 2003
      display-name: "&6Banderilla Picante"
      hunger: 8
      saturation: 0.9
      price: 10
      trade-max-uses: 16
      trade-xp: 5
      effects:
        - type: SPEED
          duration: 300
          amplifier: 0
    banderilla_mozzarella:
      base-material: COOKED_PORKCHOP
      custom-model-data: 2004
      display-name: "&6Banderilla con Mozzarella"
      hunger: 8
      saturation: 1.0
      price: 11
      trade-max-uses: 12
      trade-xp: 10
      effects:
        - type: INCREASE_DAMAGE
          duration: 300
          amplifier: 0
    banderilla_premium:
      # GOLDEN_APPLE para que sea "siempre comestible" como el original; de yapa trae
      # la Regeneración corta propia de la manzana dorada vanilla (no estaba en el
      # diseño original, pero pega bien con el tema "premium/dorado").
      base-material: GOLDEN_APPLE
      custom-model-data: 2005
      display-name: "&6Banderilla Premium"
      hunger: 10
      saturation: 1.2
      price: 18
      trade-max-uses: 8
      trade-xp: 20
      effects:
        - type: DAMAGE_RESISTANCE
          duration: 400
          amplifier: 0
        - type: ABSORPTION
          duration: 2400
          amplifier: 0

  drinks:
    # Las bebidas todavía no las vende ningún chef (en el diseño original tampoco);
    # por ahora se consiguen con /comida dar.
    cola_ottoke:
      custom-model-data: 2101
      display-name: "&bCola Ottoke"
      color: "#3B1A00"
      hunger: 2
      saturation: 0.3
      effects:
        - type: DAMAGE_RESISTANCE
          duration: 1200
          amplifier: 0
    te_durazno:
      custom-model-data: 2102
      display-name: "&6Té de Durazno"
      color: "#E8A33D"
      hunger: 2
      saturation: 0.4
      effects:
        - type: REGENERATION
          duration: 400
          amplifier: 1
    limon_ottoke:
      custom-model-data: 2103
      display-name: "&eSoda de Limón"
      color: "#D9E34D"
      hunger: 2
      saturation: 0.25
      effects:
        - type: SLOW_FALLING
          duration: 200
          amplifier: 0
    naranja_ottoke:
      custom-model-data: 2104
      display-name: "&6Soda de Naranja"
      color: "#E87B1E"
      hunger: 3
      saturation: 0.3
      effects:
        - type: SPEED
          duration: 1200
          amplifier: 1
    ginger_ottoke:
      custom-model-data: 2105
      display-name: "&fGinger Ale"
      color: "#D8C27A"
      hunger: 1
      saturation: 0.2
      effects:
        - type: NIGHT_VISION
          duration: 3000
          amplifier: 0

shops:
  # Un aldeano "chef" que vende food.items a cambio de monedas. Bukkit no permite
  # reskinear la entidad (no hay chef con modelo propio como en el mod de Forge); se usa
  # un Villager vanilla con la profesión que visualmente se parezca más.
  ottoke:
    display-name: "&6Chef Ottoke"
    profession: BUTCHER
    sells:
      - banderilla_clasica
      - banderilla_papa
      - banderilla_picante
      - banderilla_mozzarella
      - banderilla_premium

world-events:
  # Eventos GLOBALES: afectan a TODO el servidor, no a un jugador puntual. /evento gira
  # y el resultado se ve en la pantalla de todos los conectados al mismo tiempo. Pensado
  # para que lo dispare producción/staff en un momento del stream (por eso es admin-only
  # y no tiene cooldown: lo manejan ustedes a criterio).
  spin-steps: 16
  outcomes:
    pvp_libre:
      type: PVP_WINDOW
      display-name: "&c&l¡PVP LIBRE!"
      weight: 10
      # Fuerza el PVP activado por este tiempo y lo devuelve a como estaba al terminar.
      duration-seconds: 300
    luna_roja:
      type: RED_MOON
      display-name: "&4&l¡LUNA ROJA!"
      weight: 8
      duration-seconds: 600
      # Multiplicadores sobre la salud/daño de los mobs que nazcan mientras dura.
      mob-health-multiplier: 1.5
      mob-damage-multiplier: 1.3
      # Ítems extra (independientes de su loot normal) que pueden soltar al morir.
      bonus-drops:
        - material: ENDER_PEARL
          chance: 0.15
          min: 1
          max: 1
        - material: BONE
          chance: 0.4
          min: 1
          max: 3
        - material: GUNPOWDER
          chance: 0.3
          min: 1
          max: 2
        - material: ROTTEN_FLESH
          chance: 0.5
          min: 1
          max: 2
    tormenta:
      # Ejemplo de "command": cualquier comando de consola al empezar el evento.
      type: COMMAND
      display-name: "&9&l¡Tormenta!"
      weight: 6
      duration-seconds: 0
      command: "weather rain"

roulette:
  # La "ruleta de sucesos" al estilo Desafío/Extremo: /ruleta gira y cae en uno de estos
  # sucesos al azar (ponderado por "weight" — más alto = más probable), con una pequeña
  # animación tipo tragamonedas antes de revelar el resultado.
  cooldown-seconds: 300
  spin-steps: 14
  outcomes:
    vida_extra:
      category: BUENO
      type: EXTRA_LIFE
      display-name: "¡Vida extra!"
      weight: 4
    lluvia_monedas:
      category: BUENO
      type: GIVE_COINS
      display-name: "¡Lluvia de monedas!"
      weight: 10
      amount: 50
    velocidad:
      category: BUENO
      type: EFFECT
      display-name: "Zapatillas rápidas"
      weight: 10
      effect: SPEED
      duration: 600
      amplifier: 1
    fuerza:
      category: BUENO
      type: EFFECT
      display-name: "Fuerza bruta"
      weight: 8
      effect: INCREASE_DAMAGE
      duration: 600
      amplifier: 1
    regeneracion:
      category: BUENO
      type: EFFECT
      display-name: "Curación rápida"
      weight: 8
      effect: REGENERATION
      duration: 200
      amplifier: 1
    absorcion:
      category: BUENO
      type: EFFECT
      display-name: "Corazones extra"
      weight: 6
      effect: ABSORPTION
      duration: 2400
      amplifier: 1
    festin_gratis:
      # Ejemplo de "command": reutiliza /comida dar para entregar un premio sin tener
      # que programar un tipo de suceso nuevo.
      category: BUENO
      type: COMMAND
      display-name: "¡Festín gratis!"
      weight: 6
      command: "comida dar %player% banderilla_premium 1"
    veneno:
      category: MALO
      type: EFFECT
      display-name: "Comida en mal estado"
      weight: 10
      effect: POISON
      duration: 100
      amplifier: 0
    ceguera:
      category: MALO
      type: EFFECT
      display-name: "Oscuridad total"
      weight: 8
      effect: BLINDNESS
      duration: 150
      amplifier: 0
    lentitud:
      category: MALO
      type: EFFECT
      display-name: "Patas de plomo"
      weight: 8
      effect: SLOW
      duration: 200
      amplifier: 1
    debilidad:
      category: MALO
      type: EFFECT
      display-name: "Mano floja"
      weight: 8
      effect: WEAKNESS
      duration: 200
      amplifier: 1
    perder_monedas:
      category: MALO
      type: TAKE_COINS
      display-name: "Te robaron"
      weight: 10
      amount: 30
    rayo_caos:
      category: MALO
      type: LIGHTNING
      display-name: "Mal karma"
      weight: 6
    perder_vida:
      category: MALO
      type: LOSE_LIFE
      display-name: "Mala suerte extrema"
      weight: 3
    tarea_construir:
      category: TAREA
      type: TASK
      display-name: "Tarea: construir un refugio"
      weight: 8
      description: "Construí un refugio de al menos 5x5 en los próximos 10 minutos"
      duration-seconds: 600
      reward-coins: 100
      penalty-coins: 50
    tarea_recolectar:
      category: TAREA
      type: TASK
      display-name: "Tarea: recolectar minerales"
      weight: 8
      description: "Conseguí 10 de cualquier mineral en los próximos 8 minutos"
      duration-seconds: 480
      reward-coins: 80
      penalty-coins: 40

death-effects:
  # Efectos que se reproducen a TODOS los jugadores cuando alguien muere.
  enabled: true
  particle:
    # Lista de partículas válidas: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
    name: EXPLOSION_HUGE
    count: 1
  sound:
    # Lista de sonidos válidos: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
    name: ENTITY_GENERIC_EXPLODE
    volume: 1.0
    pitch: 1.0
  # Rayo decorativo en el punto de la muerte (NO hace daño ni prende fuego).
  lightning-effect: true
  title:
    enabled: true
    death-text: "&c%player% ha muerto"
    eliminated-text: "&4☠ %player% ELIMINADO ☠"

pvp-kill-rewards:
  # Cuando un jugador mata a otro en combate (no por caída, lava, mobs, etc.), además
  # de los efectos de muerte normales caen estos "trofeos" al lugar de la muerte.
  enabled: true
  # Cae la cabeza de la víctima (con su skin real).
  head-drop: true
  coin-reward:
    enabled: true
    # Valor total (en la unidad de la economía) que cae como monedas físicas,
    # repartido en las denominaciones de economy.coins (de mayor a menor).
    value: 50

messages:
  prefix: "&8[&cVoranix&6Extremo&8] &r"
  life-lost: "&c%player% &7perdió una vida. Le quedan &c%vidas% &7vida(s)."
  eliminated: "&4%player% &7ha sido &4ELIMINADO&7 de la serie."
  vidas-check: "&7Tienes &c%vidas% &7vida(s) restantes."
  vidas-check-other: "&c%player% &7tiene &c%vidas% &7vida(s) restantes."
  no-permission: "&cNo tienes permiso para usar este comando."
  only-players: "&cEste comando solo puede ser usado por jugadores."
  player-not-found: "&cJugador no encontrado."
  pvp-enabled: "&a¡El PVP ha sido ACTIVADO!"
  pvp-disabled: "&c¡El PVP ha sido DESACTIVADO!"
  roulette-spinning: "&6¡%player% está girando la ruleta de sucesos!"
  roulette-result-bueno: "&a%player% obtuvo: &f%resultado%"
  roulette-result-malo: "&c%player% obtuvo: &f%resultado%"
  roulette-result-tarea: "&e%player% tiene una nueva tarea: &f%resultado%"
  roulette-task-assigned: "&e%player% tiene %segundos% segundos para: &f%tarea%"
  roulette-task-completed: "&a%player% completó su tarea de la ruleta."
  roulette-task-failed: "&c%player% falló su tarea de la ruleta."
  world-event-spinning: "&6&l¡Se está girando la RULETA DE EVENTOS MUNDIALES!"
  world-event-started: "&d&l¡Comenzó: %evento%!"
  world-event-ended: "&7El evento %evento% terminó."
