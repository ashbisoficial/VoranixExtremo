# Configuración de VoranixExtremo

resourcepack:
  # Déjalo vacío: el plugin ya manda su propio pack (ruleta de colores + monedas + comida),
  # configurado en ruleta-colores.resource-pack. La 1.20.1 acepta un solo pack del servidor,
  # así que si pones aquí la URL de otro pack, se manda ese en vez del del plugin (y para que
  # se vea la ruleta ese pack tiene que incluir plugins/VoranixExtremo/ruleta-pack.zip).
  url: ""

# Mensaje que sale en el chat cuando un jugador usa (popea) un tótem.
# %usuario% = nombre del jugador. Déjalo vacío ("") para que no salga nada.
totempop: "&6&L%usuario% a utilizado un tótem"

lives:
  # Vidas con las que empieza cada jugador.
  max: 5
  # Gamemode al que pasa un jugador cuando se queda sin vidas.
  elimination-gamemode: SPECTATOR

pvp:
  # Estado del PVP cuando el plugin se activa por primera vez.
  enabled-by-default: true
  # Sonido que se reproduce a todos los jugadores al activar/desactivar el PVP.
  # Lista de sonidos válidos: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
  sound:
    name: ENTITY_ENDER_DRAGON_GROWL
    volume: 1.0
    pitch: 1.0

economy:
  # Si Vault está instalado en el servidor, VoranixExtremo se registra como su
  # proveedor de economía (así otros plugins de tiendas/subastas usan esta moneda).
  vault-integration: true

  currency:
    singular: "Moneda"
    plural: "Monedas"

  # Cada moneda es un ítem vanilla (material) + un custom-model-data que el resource
  # pack usa para dibujar la textura/modelo real (ver carpeta resourcepack/ en el repo).
  # "value" es el valor de cada moneda en la unidad de la economía (pagar, depositar, retirar).
  # Las 6 denominaciones, texturas, colores (por rareza) y la tasa de conversión (x10 por
  # nivel) vienen del diseño original en el repo voranixmod (CoinDenomination.java).
  # Todas usan IRON_NUGGET como base para que ningún crafteo vanilla las confunda.
  coins:
    estano:
      material: IRON_NUGGET
      custom-model-data: 1001
      display-name: "&fMoneda de Estaño"
      value: 1
    silver:
      material: IRON_NUGGET
      custom-model-data: 1002
      display-name: "&eMoneda de Plata"
      value: 10
    gold:
      material: IRON_NUGGET
      custom-model-data: 1003
      display-name: "&bMoneda de Oro"
      value: 100
    mithril:
      material: IRON_NUGGET
      custom-model-data: 1004
      display-name: "&bMoneda de Mithril"
      value: 1000
    oricalco:
      material: IRON_NUGGET
      custom-model-data: 1005
      display-name: "&dMoneda de Oricalco"
      value: 10000
    ajna:
      material: IRON_NUGGET
      custom-model-data: 1006
      display-name: "&dMoneda de Ajna"
      value: 100000

food:
  # Comidas vendibles por un chef (food.items) y bebidas (food.drinks), con los mismos
  # valores de hambre/saturación/efectos/precio del diseño original en voranixmod
  # (OttokeConfig.java y ModItems.java del módulo "ottoke"). "saturation" es el
  # modificador vanilla (no puntos de saturación directos): saturación real
  # restaurada = hunger * saturation * 2, igual que cualquier comida de Minecraft.
  # "price" está en unidades base (el valor de la moneda Estaño); -1 = no se vende.
  items:
    banderilla_clasica:
      base-material: COOKED_PORKCHOP
      custom-model-data: 2001
      display-name: "&6Banderilla Clásica"
      hunger: 8
      saturation: 0.8
      price: 8
      trade-max-uses: 20
      trade-xp: 2
    banderilla_papa:
      base-material: COOKED_PORKCHOP
      custom-model-data: 2002
      display-name: "&6Banderilla con Papa"
      hunger: 9
      saturation: 0.7
      price: 10
      trade-max-uses: 16
      trade-xp: 5
    banderilla_picante:
      base-material: COOKED_PORKCHOP
      custom-model-data: 2003
      display-name: "&6Banderilla Picante"
      hunger: 8
      saturation: 0.9
      price: 10
      trade-max-uses: 16
      trade-xp: 5
      effects:
        - type: SPEED
          duration: 300
          amplifier: 0
    banderilla_mozzarella:
      base-material: COOKED_PORKCHOP
      custom-model-data: 2004
      display-name: "&6Banderilla con Mozzarella"
      hunger: 8
      saturation: 1.0
      price: 11
      trade-max-uses: 12
      trade-xp: 10
      effects:
        - type: INCREASE_DAMAGE
          duration: 300
          amplifier: 0
    banderilla_premium:
      # GOLDEN_APPLE para que sea "siempre comestible" como el original; de yapa trae
      # la Regeneración corta propia de la manzana dorada vanilla (no estaba en el
      # diseño original, pero pega bien con el tema "premium/dorado").
      base-material: GOLDEN_APPLE
      custom-model-data: 2005
      display-name: "&6Banderilla Premium"
      hunger: 10
      saturation: 1.2
      price: 18
      trade-max-uses: 8
      trade-xp: 20
      effects:
        - type: DAMAGE_RESISTANCE
          duration: 400
          amplifier: 0
        - type: ABSORPTION
          duration: 2400
          amplifier: 0

  drinks:
    # Las bebidas todavía no las vende ningún chef (en el diseño original tampoco);
    # por ahora se consiguen con /comida dar.
    cola_ottoke:
      custom-model-data: 2101
      display-name: "&bCola Ottoke"
      color: "#3B1A00"
      hunger: 2
      saturation: 0.3
      effects:
        - type: DAMAGE_RESISTANCE
          duration: 1200
          amplifier: 0
    te_durazno:
      custom-model-data: 2102
      display-name: "&6Té de Durazno"
      color: "#E8A33D"
      hunger: 2
      saturation: 0.4
      effects:
        - type: REGENERATION
          duration: 400
          amplifier: 1
    limon_ottoke:
      custom-model-data: 2103
      display-name: "&eSoda de Limón"
      color: "#D9E34D"
      hunger: 2
      saturation: 0.25
      effects:
        - type: SLOW_FALLING
          duration: 200
          amplifier: 0
    naranja_ottoke:
      custom-model-data: 2104
      display-name: "&6Soda de Naranja"
      color: "#E87B1E"
      hunger: 3
      saturation: 0.3
      effects:
        - type: SPEED
          duration: 1200
          amplifier: 1
    ginger_ottoke:
      custom-model-data: 2105
      display-name: "&fGinger Ale"
      color: "#D8C27A"
      hunger: 1
      saturation: 0.2
      effects:
        - type: NIGHT_VISION
          duration: 3000
          amplifier: 0

shops:
  # Un aldeano "chef" que vende food.items a cambio de monedas. Bukkit no permite
  # reskinear la entidad (no hay chef con modelo propio como en el mod de Forge); se usa
  # un Villager vanilla con la profesión que visualmente se parezca más.
  ottoke:
    display-name: "&6Chef Ottoke"
    profession: BUTCHER
    sells:
      - banderilla_clasica
      - banderilla_papa
      - banderilla_picante
      - banderilla_mozzarella
      - banderilla_premium

world-events:
  # Eventos GLOBALES: afectan a TODO el servidor, no a un jugador puntual. /ruleta gira
  # y el resultado se ve en la pantalla de todos los conectados al mismo tiempo. Pensado
  # para que lo dispare producción/staff en un momento del stream (por eso es admin-only
  # y no tiene cooldown: lo manejan ustedes a criterio).
  #
  # Cada suceso tiene una "category" que define su color (en el título y en la barra de
  # progreso que se ve mientras gira): PELIGRO = rojo, BUENO = verde, NEUTRAL = amarillo.
  # El "display-name" ya no necesita código de color — lo pone la categoría solo.
  outcomes:
    pvp_libre:
      type: PVP_WINDOW
      category: PELIGRO
      display-name: "&l¡PVP LIBRE!"
      weight: 10
      # Fuerza el PVP activado por este tiempo y lo devuelve a como estaba al terminar.
      duration-seconds: 300
    luna_roja:
      type: RED_MOON
      category: PELIGRO
      display-name: "&l¡LUNA ROJA!"
      weight: 8
      duration-seconds: 600
      # Multiplicadores sobre la salud/daño de los mobs que nazcan mientras dura.
      mob-health-multiplier: 1.5
      mob-damage-multiplier: 1.3
      # Ítems extra (independientes de su loot normal) que pueden soltar al morir.
      bonus-drops:
        - material: ENDER_PEARL
          chance: 0.15
          min: 1
          max: 1
        - material: BONE
          chance: 0.4
          min: 1
          max: 3
        - material: GUNPOWDER
          chance: 0.3
          min: 1
          max: 2
        - material: ROTTEN_FLESH
          chance: 0.5
          min: 1
          max: 2
    buena_racha:
      # Ejemplo "BUENO" (verde): le da Velocidad II a todos los jugadores conectados por
      # 5 minutos. duration-seconds en 0 porque el efecto ya trae su propia duración; acá
      # no hace falta que el plugin lo revierta él mismo.
      type: COMMAND
      category: BUENO
      display-name: "&l¡Buena racha para todos!"
      weight: 8
      duration-seconds: 0
      command: "effect give @a minecraft:speed 300 1"
    tormenta:
      # Ejemplo "NEUTRAL" (amarillo) y de "command": cualquier comando de consola al
      # empezar el evento, ni bueno ni peligroso, solo ambientación.
      type: COMMAND
      category: NEUTRAL
      display-name: "&l¡Tormenta!"
      weight: 6
      duration-seconds: 0
      command: "weather rain"
    momento_revill:
      # Al estilo DEDsafio: tormenta + lluvia de meteoritos + un objetivo con cuenta
      # regresiva visible (boss bar). Quien no lo cumpla cuando se acaba el tiempo queda
      # ELIMINADO directo (no pierde 1 vida, va a 0). Ajustá "objective-y" a algo real de
      # su mapa (ej. la altura de su búnker) antes de usarlo en serio.
      type: REVILL
      category: PELIGRO
      display-name: "&l¡MOMENTO REVILL!"
      weight: 5
      duration-seconds: 90
      objective-description: "¡Bajen a Y=40 o serán ELIMINADOS!"
      objective-type: Y_BELOW
      objective-y: 40
      # Cada cuántos ticks (20 = 1 segundo) cae un meteorito, y qué tan fuerte explota.
      meteor-interval-ticks: 40
      meteor-yield: 1.5
      # Si es false, el meteorito hace ruido/partículas/empuje pero no rompe bloques.
      meteor-break-blocks: false

death-effects:
  # Efectos que se reproducen a TODOS los jugadores cuando alguien muere.
  enabled: true
  particle:
    # Lista de partículas válidas: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
    name: EXPLOSION_HUGE
    count: 1
  sound:
    # Lista de sonidos válidos: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
    name: ENTITY_GENERIC_EXPLODE
    volume: 1.0
    pitch: 1.0
  # Rayo decorativo en el punto de la muerte (NO hace daño ni prende fuego).
  lightning-effect: true
  title:
    enabled: true
    death-text: "&c%player% ha muerto"
    eliminated-text: "&4☠ %player% ELIMINADO ☠"

pvp-kill-rewards:
  # Cuando un jugador mata a otro en combate (no por caída, lava, mobs, etc.), además
  # de los efectos de muerte normales pasa esto en el lugar de la muerte.
  enabled: true
  # Arma un mini monumento: un bloque de "trophy-wall-material" con la cabeza de la
  # víctima (su skin real) montada encima.
  head-drop: true
  trophy-wall-material: DEEPSLATE_BRICK_WALL
  # Al momento de poner el trofeo: sonido + un breve remolino de partículas de alma
  # alrededor de la cabeza (dura "trophy-particle-duration-ticks", 20 ticks = 1 segundo;
  # después queda el monumento solo, sin partículas, para no acumular efectos permanentes
  # en una serie larga).
  trophy-sound: ENTITY_WITHER_AMBIENT
  trophy-particle-duration-ticks: 60
  # Suma un Cristal del Fin flotando sobre la cabeza, permanente (da el brillo/haz de luz
  # giratorio nativo del juego, gratis, sin plugin haciendo nada tick a tick). Es
  # invulnerable para que no explote si lo golpean. Por defecto se ve igual que un cristal
  # del fin normal (blanco/verde); para el look rojo/oscuro de la referencia hay que poner
  # una textura propia en el resource pack — ver README.
  trophy-crystal: true
  coin-reward:
    enabled: true
    # Valor total (en la unidad de la economía) que recibe el asesino, directo en el
    # inventario (no se tira al piso), repartido en las denominaciones de economy.coins
    # (de mayor a menor). Si el inventario está lleno, el sobrante sí cae a sus pies.
    value: 50

# Ruleta de colores en pantalla (la del plugin Ruleta_Custom). Comando /ruletacolor
# (permiso voranixextremo.ruletacolor.admin):
#   /ruletacolor girar <color|random> [mensaje]   -> gira y cae en ese color; el mensaje se manda por broadcast
#   /ruletacolor parar | /ruletacolor pack | /ruletacolor reload
# Las texturas están en resourcepack/Ruleta y se mandan como un pack aparte del de las monedas.
# En los mensajes puedes usar MiniMessage (<red>, <gradient:...>) o códigos & (&c, &l).
# {color} se reemplaza por el nombre del color que salió.
ruleta-colores:
  # Duración del giro (20 ticks = 1 segundo)
  duracion-ticks: 140
  # Vueltas completas antes de frenar
  vueltas: 4
  # Al terminar, la ruleta se tiñe del color ganador, tiembla y desaparece.
  # Esto es cuánto rato queda teñida y quieta antes de temblar (0 = como en el diseño original)
  resultado-segundos: 0.5

  sonidos:
    tick: "minecraft:block.note_block.hat"   # al pasar de un color a otro ("none" para quitarlo)
    final: "minecraft:entity.player.levelup"

  # Nombre de cada color de la ruleta (el orden de los colores viene en el resource pack: 8 colores -
  # rojo/naranjo/amarillo/verde/celeste/azul/morado/rosa). Quedan SIN mensaje y SIN comandos a propósito:
  # la idea es que producción los cargue/cambie cada día antes del stream (ver "Cómo cargar los eventos
  # del día" en el README), no que queden fijos en el código. Mientras estén vacíos, /ruletacolor girar
  # <color> solo gira y muestra el nombre, sin ejecutar nada ni mandar un mensaje especial.
  #
  # "mensaje" (opcional): texto de broadcast propio de ese color (si no está, usa mensajes.broadcast).
  # "comandos" (opcional, lista): se ejecutan por CONSOLA -con permisos completos, igual que /ruleta-
  # en el instante en que la ruleta cae en ese color (antes de que tiemble y desaparezca). Podés poner
  # cualquier comando de servidor (effect, weather, summon, give, pvp toggle, etc.), uno por línea.
  colores:
    rojo:
      nombre: "<#ff2b2b><bold>ROJO"
    naranjo:
      nombre: "<#ff8a1c><bold>NARANJO"
    amarillo:
      nombre: "<#ffe12b><bold>AMARILLO"
    verde:
      nombre: "<#2bd94a><bold>VERDE"
    celeste:
      nombre: "<#2be4ff><bold>CELESTE"
    azul:
      nombre: "<#2b8cff><bold>AZUL"
    morado:
      nombre: "<#6a3bff><bold>MORADO"
    rosa:
      nombre: "<#e02bff><bold>ROSA"

  mensajes:
    prefijo: "<dark_gray>[<gold>Ruleta<dark_gray>] <gray>"
    prefijo-broadcast: "<dark_gray>[<gold>Ruleta<dark_gray>] "
    # Se usa cuando no escribes mensaje en el comando ni el color tiene uno propio
    broadcast: "<yellow>¡La ruleta cayó en {color}<yellow>!"
    uso: "Uso: <yellow>/ruletacolor girar <color|random> [mensaje]"
    ya-girando: "<red>La ruleta ya está girando."
    no-girando: "<red>La ruleta no está girando."
    parada: "Ruleta detenida."
    color-invalido: "<red>El color <white>{color}</white> no existe."
    pack-enviado: "Resource pack de la ruleta enviado a todos."
    recargado: "<green>Configuración recargada."

  resource-pack:
    enviar-al-entrar: true
    obligatorio: false
    mensaje: "<gold>Este pack es necesario para ver la ruleta."
    # Servidor HTTP propio del plugin (abre este puerto en el firewall del VPS)
    servidor-interno: true
    puerto: 8165
    # IP o dominio con el que los jugadores llegan a tu servidor, ej: voranixstudio.tech
    ip-publica: "127.0.0.1"
    # Si prefieres subir plugins/VoranixExtremo/ruleta-pack.zip a otro lado, pon aquí el link directo
    url-externa: ""

messages:
  prefix: "&8[&cVoranix&6Extremo&8] &r"
  life-lost: "&c%player% &7perdió una vida. Le quedan &c%vidas% &7vida(s)."
  eliminated: "&4%player% &7ha sido &4ELIMINADO&7 de la serie."
  vidas-check: "&7Tienes &c%vidas% &7vida(s) restantes."
  vidas-check-other: "&c%player% &7tiene &c%vidas% &7vida(s) restantes."
  no-permission: "&cNo tienes permiso para usar este comando."
  reloaded: "&aConfiguración de VoranixExtremo recargada."
  only-players: "&cEste comando solo puede ser usado por jugadores."
  player-not-found: "&cJugador no encontrado."
  pvp-enabled: "&a¡El PVP ha sido ACTIVADO!"
  pvp-disabled: "&c¡El PVP ha sido DESACTIVADO!"
  world-event-spinning: "&6&l¡Se está girando la RULETA DE EVENTOS MUNDIALES!"
  world-event-started: "&d&l¡Comenzó: %evento%!"
  world-event-ended: "&7El evento %evento% terminó."
  revill-objective: "&4&l¡MOMENTO REVILL! &r&c%objetivo%"
  revill-eliminated: "&4☠ %player% no cumplió el objetivo del Revill y fue ELIMINADO."
  revill-summary: "&7Revill terminado: &a%sobrevivientes% sobrevivieron&7, &c%eliminados% eliminados&7."
