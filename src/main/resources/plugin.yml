name: VoranixExtremo
version: '${project.version}'
main: com.voranixextremo.plugin.VoranixExtremoPlugin
api-version: '1.20'
author: ashbisoficial
description: Plugin base para la serie Voranix Extremo (vidas, PVP, economía y futuras mecánicas de evento).
softdepend: [Vault]

commands:
  vidas:
    description: Consulta o administra las vidas de los jugadores.
    usage: "/<command> [jugador|set <jugador> <cantidad>|reset <jugador>]"
    permission: voranixextremo.vidas
  pvp:
    description: Activa o desactiva el PVP del servidor.
    usage: "/<command> [on|off|toggle]"
    permission: voranixextremo.pvp
  dinero:
    description: Consulta o administra el balance (banco) de los jugadores.
    usage: "/<command> [pagar <jugador> <cantidad>|dar|quitar|set <jugador> <cantidad>]"
    permission: voranixextremo.economia
  banco:
    description: Convierte monedas físicas en balance y viceversa.
    usage: "/<command> <depositar|retirar> [cantidad]"
    permission: voranixextremo.economia
  moneda:
    description: Entrega monedas físicas a un jugador.
    usage: "/<command> dar <jugador> <tipo> [cantidad]"
    permission: voranixextremo.moneda.admin
  comida:
    description: Entrega comida o bebidas a un jugador.
    usage: "/<command> dar <jugador> <id> [cantidad]"
    permission: voranixextremo.comida.admin
  chef:
    description: Aparece o elimina un aldeano chef que vende comida por monedas.
    usage: "/<command> <spawn <tienda>|remove>"
    permission: voranixextremo.chef.admin
  ruleta:
    description: Gira la ruleta de eventos (afecta a todo el servidor, se ve en la pantalla de todos).
    usage: "/<command> [girar|estado|detener]"
    permission: voranixextremo.ruleta.admin

permissions:
  voranixextremo.vidas:
    description: Permite consultar las propias vidas.
    default: true
  voranixextremo.vidas.admin:
    description: Permite administrar las vidas de cualquier jugador (set/reset).
    default: op
  voranixextremo.pvp:
    description: Permite activar o desactivar el PVP del servidor.
    default: op
  voranixextremo.economia:
    description: Permite usar /dinero y /banco sobre la propia cuenta.
    default: true
  voranixextremo.dinero.admin:
    description: Permite dar, quitar o fijar el balance de cualquier jugador.
    default: op
  voranixextremo.moneda.admin:
    description: Permite entregar monedas físicas a cualquier jugador.
    default: op
  voranixextremo.comida.admin:
    description: Permite entregar comida o bebidas a cualquier jugador.
    default: op
  voranixextremo.chef.admin:
    description: Permite aparecer o eliminar aldeanos chef.
    default: op
  voranixextremo.ruleta.admin:
    description: Permite girar, consultar o detener la ruleta de eventos.
    default: op
