name: Build plugin

on:
  push:
    branches: [claude/laughing-edison-9cy1yw]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Diagnostico API PacketEvents
        run: |
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          CP=$(cat cp.txt)
          javap -cp "$CP" 'com.github.retrooper.packetevents.wrapper.play.server.WrapperPlayServerTeams$OptionData' || true
          javap -cp "$CP" 'com.github.retrooper.packetevents.wrapper.play.server.WrapperPlayServerTeams$ScoreBoardTeamInfo' || true
          javap -cp "$CP" 'com.github.retrooper.packetevents.wrapper.play.server.WrapperPlayServerTeams' || true
      - name: Compilar y empaquetar
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: VoranixExtremo
          path: target/VoranixExtremo-*.jar
